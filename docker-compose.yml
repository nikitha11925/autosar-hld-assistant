services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw_pdfs:/app/data/raw_pdfs
      - ./data/chroma_db:/app/data/chroma_db
    environment:
      - FAISS_PERSIST_DIR=/app/data/chroma_db
      - SQLITE_DB_PATH=/app/data/audit.sqlite3
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
